<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bioinfo4Women · Seminars</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #2d3748;
      line-height: 1.6;
      background: linear-gradient(135deg, rgba(150,69,192,0.08), rgba(115,132,193,0.08), rgba(79,194,194,0.08));
    }
    .hero-banner {
      position: relative;
      min-height: 56vh;
      display: flex;
      align-items: flex-end;
      background-image: linear-gradient(130deg, rgba(150, 69, 192, 0.62), rgba(115, 132, 193, 0.55), rgba(79, 194, 194, 0.45)), url("images/team/coordinator8.jpg");
      background-size: cover;
      background-position: center;
      color: #fff;
      padding: 2rem 2rem 3rem;
    }
    .hero-top-nav {
      position: absolute;
      top: 1.2rem;
      left: 2rem;
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
    }
    .back-link {
      text-decoration: none;
      color: #fff;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
      background: rgba(16, 20, 26, 0.28);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .hero-content { max-width: 960px; }
    h1 {
      font-size: clamp(2.2rem, 5vw, 4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      margin-bottom: 0.55rem;
    }
    .subtitle {
      font-size: clamp(1rem, 1.8vw, 1.22rem);
      max-width: 780px;
      opacity: 0.98;
    }
    .page-content {
      width: 100%;
      padding: 2.6rem 2rem 4rem;
      background: rgba(238, 244, 247, 0.72);
    }
    .container {
      max-width: 1060px;
      margin: 0 auto;
    }
    .filters {
      display: grid;
      grid-template-columns: 1.2fr 0.9fr 0.9fr;
      gap: 0.8rem;
      margin-bottom: 1.25rem;
    }
    .search-input,
    .select-input {
      width: 100%;
      border: 1.5px solid rgba(115, 132, 193, 0.3);
      border-radius: 999px;
      padding: 0.7rem 1rem;
      background: rgba(255,255,255,0.88);
      color: #2d3748;
      font-size: 0.97rem;
    }
    .search-input:focus,
    .select-input:focus {
      outline: none;
      border-color: #9645c0;
      box-shadow: 0 0 0 3px rgba(150,69,192,0.1);
    }
    .result-count {
      margin-bottom: 1rem;
      color: #5e6775;
      font-size: 0.95rem;
    }
    .seminar-list {
      display: grid;
      gap: 1rem;
    }
    .seminar-card {
      --splash-a: rgba(150, 69, 192, 0.30);
      --splash-b: rgba(79, 194, 194, 0.28);
      display: block;
      padding: 1.1rem;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.85);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }
    .seminar-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.9;
      z-index: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
      background-image: var(--splash-gradients, none);
      background-repeat: no-repeat;
    }
    .seminar-card:hover::before {
      transform: scale(1.04);
      opacity: 1;
    }
    .seminar-card > * {
      position: relative;
      z-index: 1;
    }
    .talk-title {
      font-size: 1.18rem;
      color: #1d1d1f;
      margin-bottom: 0.35rem;
      line-height: 1.35;
    }
    .meta {
      font-size: 0.93rem;
      color: #646b76;
      margin-bottom: 0.55rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .chip {
      display: inline-block;
      font-size: 0.78rem;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      background: rgba(79,194,194,0.14);
      color: #2f7a7a;
      font-weight: 600;
    }
    .abstract { color: #4a5568; font-size: 0.98rem; }
    .empty-state {
      display: none;
      text-align: center;
      color: #5e6775;
      padding: 2rem 0;
    }
    @media (max-width: 860px) {
      .hero-banner { min-height: 50vh; padding: 1.4rem 1.2rem 2rem; }
      .hero-top-nav { left: 1.2rem; top: 1rem; }
      .page-content { padding: 2rem 1.2rem 3rem; }
      .filters { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="hero-banner">
    <nav class="hero-top-nav">
      <a href="index.html#research" class="back-link">← Back to Activities</a>
      <a href="index.html" class="back-link">Back to Home</a>
    </nav>
    <div class="hero-content">
      <h1>Severo Ochoa Seminars List</h1>
      <p class="subtitle">
        Browse and search seminars by year, topic, and keywords. This page is ready to grow as our seminar archive expands.
      </p>
    </div>
  </header>

  <main class="page-content">
    <div class="container">
      <div class="filters">
        <input type="text" id="seminar-search" class="search-input" placeholder="Search by title, speaker, abstract..." />
        <select id="year-filter" class="select-input"></select>
        <select id="topic-filter" class="select-input"></select>
      </div>
      <p class="result-count" id="result-count"></p>
      <section class="seminar-list" id="seminar-list"></section>
      <p class="empty-state" id="empty-state">No seminars match the current filters.</p>
    </div>
  </main>
  <script>
    const seminars = [
      {
        speaker: "Shireen Sindi",
        title: "Sex and Gender Differences in Dementia and Alzheimer's Disease",
        date: "2024-05-30",
        host: "Davide Cirillo",
        topics: ["Dementia", "Alzheimer's Disease", "Sex and Gender"],
        abstract:
          "The lecture covers sex differences in dementia epidemiology, factors driving these differences, and current evidence on sex and gender in dementia risk and protective factors.",
        link: "https://bioinfo4women.bsc.es/research-seminars/sex-and-gender-differences-in-dementia-and-alzheimers-disease/"
      },
      {
        speaker: "Galadriel Brière",
        title: "Random Walk with Restart on multilayer networks: from node prioritisation to supervised link prediction and beyond",
        date: "2024-05-28",
        host: "Alfonso Valencia",
        topics: ["Networks", "Multilayer Models", "Computational Biology"],
        abstract:
          "How multilayer biological networks integrate heterogeneous data and enable advanced methods from node prioritization to link prediction.",
        link: "https://bioinfo4women.bsc.es/research-seminars/random-walk-with-restart-on-multilayer-networks-from-node-prioritisation-to-supervised-link-prediction-and-beyond/"
      },
      {
        speaker: "Mercè Botinas i Martí",
        title: "Diferencias y Desigualdades: Realidad o Ficción. Invitación a La medicina con Visión de Género.",
        date: "2024-05-23",
        host: "Alba Jené",
        topics: ["Gender Medicine", "Health Equity", "Clinical Practice"],
        abstract:
          "A critical discussion on persistent sex and gender bias in medicine and the need for evidence-based gender perspective in healthcare.",
        link: "https://bioinfo4women.bsc.es/research-seminars/diferencias-y-desigualdades-realidad-o-ficcion-invitacion-a-la-medicina-con-vision-de-genero/"
      },
      {
        speaker: "Anna Pascual",
        title: "Spatial Transcriptomics – An Overview and Application to map tissue pathology",
        date: "2024-05-09",
        host: "Marta Melé",
        topics: ["Spatial Transcriptomics", "Pathology", "Genomics"],
        abstract:
          "Overview of spatial transcriptomics and its application to identify tissue pathology biomarkers beyond conventional methods.",
        link: "https://bioinfo4women.bsc.es/research-seminars/spatial-transcriptomics-an-overview-and-application-to-map-tissue-pathology/"
      },
      {
        speaker: "Pilar Nicolás",
        title: "Data processing for scientific research: a legal approach in a case study",
        date: "2024-04-03",
        host: "Alfonso Valencia",
        topics: ["Research Data", "Legal", "Ethics"],
        abstract:
          "A practical case-study perspective on legal obligations and compliant data-processing workflows in biomedical research.",
        link: "https://bioinfo4women.bsc.es/research-seminars/data-processing-for-scientific-research-a-legal-approach-in-a-case-study/"
      },
      {
        speaker: "Paula Petrone",
        title: "Prediction is better than cure: how explainable AI can improve healthcare",
        date: "2024-03-14",
        host: "Alba Jené",
        topics: ["Explainable AI", "Healthcare", "Machine Learning"],
        abstract:
          "Use cases showing how explainable machine learning can improve non-invasive diagnostics and clinical decision support.",
        link: "https://bioinfo4women.bsc.es/research-seminars/prediction-is-better-than-cure-how-explainable-ai-can-improve-healthcare/"
      },
      {
        speaker: "Beatrice Dalpedri",
        title: "Exploring the network's world: From omics-driven machine learning workflow for drug target identification to quantisation of signalling model diversity",
        date: "2024-03-07",
        host: "Alfonso Valencia",
        topics: ["Drug Discovery", "Omics", "Machine Learning"],
        abstract:
          "From omics-driven workflows to signaling model diversity, with focus on computational strategies for drug target discovery.",
        link: "https://bioinfo4women.bsc.es/research-seminars/exploring-the-networks-world-from-omics-driven-machine-learning-workflow-for-drug-target-identification-to-quantisation-of-signalling-model-diversity/"
      },
      {
        speaker: "Sarah Tishkoff",
        title: "African Integrative Genomics: Reconstructing Human Evolution and the Genetic Basis of Complex Adaptive Traits",
        date: "2024-02-22",
        host: "Marta Melé",
        topics: ["Human Evolution", "Population Genomics", "Africa"],
        abstract:
          "Integrative genomics perspective on African populations, human evolution, and the genetics of complex adaptive traits.",
        link: "https://bioinfo4women.bsc.es/research-seminars/african-integrative-genomics-reconstructing-human-evolution-and-the-genetic-basis-of-complex-adaptive-traits/"
      },
      {
        speaker: "Margarida Cardoso Moreira",
        title: "The evolution of organs and cell types",
        date: "2024-02-15",
        host: "Gonzalo Parra",
        topics: ["Evolution", "Developmental Biology", "Cell Types"],
        abstract:
          "Research on organ evolution and the developmental basis of sex differences through comparative and evolutionary approaches.",
        link: "https://bioinfo4women.bsc.es/research-seminars/the-evolution-of-organs-and-cell-types/"
      },
      {
        speaker: "Silvia Osuna",
        title: "Development of new computational tools and approaches for computational enzyme design",
        date: "2023-11-09",
        host: "Victor Guallar",
        topics: ["Enzyme Design", "Computational Chemistry", "Tools"],
        abstract:
          "New computational methods for enzyme design and their application in modern biocatalysis and molecular engineering.",
        link: "https://bioinfo4women.bsc.es/research-seminars/development-of-new-computational-tools-and-approaches-for-computational-enzyme-design/"
      },
      {
        speaker: "Laura Luebbert",
        title: "Efficient and accurate detection of viral sequences in bulk and single-cell transcriptomics data",
        date: "2023-09-21",
        host: "Marta Melé",
        topics: ["Virology", "Transcriptomics", "Single-cell"],
        abstract:
          "Methods for accurate viral sequence detection in bulk and single-cell transcriptomics and their implications for infectious disease research.",
        link: "https://bioinfo4women.bsc.es/research-seminars/efficient-and-accurate-detection-of-viral-sequences-in-bulk-and-single-cell-transcriptomics-data/"
      },
      {
        speaker: "Núria Queralt Rosinach",
        title: "Towards interpretable ML and explainable AI for biomedical discovery",
        date: "2023-06-01",
        host: "Alfonso Valencia",
        topics: ["Interpretable ML", "Explainable AI", "Biomedical Discovery"],
        abstract:
          "How interpretable machine learning and explainable AI can enhance biomedical discovery in the context of heterogeneous health data.",
        link: "https://bioinfo4women.bsc.es/research-seminars/towards-interpretable-ml-and-explainable-ai-for-biomedical-discovery/"
      }
    ];

    const searchInput = document.getElementById("seminar-search");
    const yearFilter = document.getElementById("year-filter");
    const topicFilter = document.getElementById("topic-filter");
    const resultCount = document.getElementById("result-count");
    const emptyState = document.getElementById("empty-state");
    
    function randomizeCardSplashes(cards) {
      const palette = ['150, 69, 192', '79, 194, 194'];
      
      cards.forEach((card) => {
        const splashCount = 1 + Math.floor(Math.random() * 4);
        const gradients = [];
        
        for (let i = 0; i < splashCount; i++) {
          const rgb = palette[Math.floor(Math.random() * palette.length)];
          const x = 8 + Math.random() * 84;
          const y = 8 + Math.random() * 84;
          const size = 46 + Math.random() * 90;
          const alpha = 0.12 + Math.random() * 0.18;
          gradients.push(
            `radial-gradient(circle ${size}px at ${x}% ${y}%, rgba(${rgb}, ${alpha.toFixed(2)}) 0%, rgba(${rgb}, 0) 72%)`
          );
        }
        
        card.style.setProperty("--splash-gradients", gradients.join(", "));
      });
    }

    function getYear(dateStr) {
      return String(new Date(dateStr).getFullYear());
    }

    function setupFilters() {
      const years = [...new Set(seminars.map((s) => getYear(s.date)))].sort((a, b) => Number(b) - Number(a));
      const topics = [...new Set(seminars.flatMap((s) => s.topics))].sort((a, b) => a.localeCompare(b));

      yearFilter.innerHTML = `<option value="all">All years</option>${years.map((y) => `<option value="${y}">${y}</option>`).join("")}`;
      topicFilter.innerHTML = `<option value="all">All topics</option>${topics.map((t) => `<option value="${t}">${t}</option>`).join("")}`;
    }

    function renderSeminars(items) {
      const list = document.getElementById("seminar-list");
      if (!list) return;

      resultCount.textContent = `${items.length} seminar${items.length === 1 ? "" : "s"} found`;
      emptyState.style.display = items.length === 0 ? "block" : "none";

      list.innerHTML = items
        .map(
          (seminar) => `
            <article class="seminar-card">
              <div>
                <h2 class="talk-title">${seminar.title}</h2>
                <p class="meta"><strong>Speaker:</strong> ${seminar.speaker} · <strong>Date:</strong> ${seminar.date} · <strong>Host:</strong> ${seminar.host} · <strong>Year:</strong> ${getYear(seminar.date)}</p>
                <div class="chips">
                  ${seminar.topics.map((topic) => `<span class="chip">${topic}</span>`).join("")}
                </div>
                <p class="abstract">${seminar.abstract}</p>
                <p class="meta" style="margin-top: 0.65rem; margin-bottom: 0;">
                  <a href="${seminar.link}" target="_blank" style="color:#9645c0; text-decoration:none; font-weight:600;">Read full seminar details ↗</a>
                </p>
              </div>
            </article>
          `
        )
        .join("");
      
      randomizeCardSplashes(list.querySelectorAll(".seminar-card"));
    }

    function applyFilters() {
      const query = searchInput.value.trim().toLowerCase();
      const selectedYear = yearFilter.value;
      const selectedTopic = topicFilter.value;

      const filtered = seminars.filter((seminar) => {
        const matchesYear = selectedYear === "all" || getYear(seminar.date) === selectedYear;
        const matchesTopic = selectedTopic === "all" || seminar.topics.includes(selectedTopic);
        const haystack = `${seminar.title} ${seminar.speaker} ${seminar.abstract} ${seminar.topics.join(" ")}`.toLowerCase();
        const matchesSearch = query === "" || haystack.includes(query);
        return matchesYear && matchesTopic && matchesSearch;
      });

      renderSeminars(filtered);
    }

    setupFilters();
    renderSeminars(seminars);
    searchInput.addEventListener("input", applyFilters);
    yearFilter.addEventListener("change", applyFilters);
    topicFilter.addEventListener("change", applyFilters);
  </script>
</body>
</html>
